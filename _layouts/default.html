<!DOCTYPE html>
<html lang="{{ site.locale | default: 'en-US' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <img class="avatar" src="{{ "/assets/image.png" | relative_url }}" alt="{{ site.name }}">
    <div class="sidebar-name">{{ site.name }}</div>
    <div class="sidebar-tagline">BME &middot; molecular &amp; cellular systems</div>
    <nav class="sidebar-nav">
      <a href="{{ "/" | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
      <a href="{{ "/projects/" | relative_url }}" class="{% if page.url contains '/projects/' %}active{% endif %}">Projects</a>
      <a href="{{ "/cv/" | relative_url }}" class="{% if page.url contains '/cv/' %}active{% endif %}">CV</a>
    </nav>
    <div class="sidebar-motif">
      <svg width="140" height="70" viewBox="0 0 140 70" aria-hidden="true">
        <circle cx="30" cy="20" r="9" fill="none" stroke="#3B6D11" stroke-width="1.5"/>
        <circle cx="110" cy="20" r="9" fill="none" stroke="#D85A30" stroke-width="1.5"/>
        <circle cx="70" cy="55" r="9" fill="none" stroke="#3B6D11" stroke-width="1.5"/>
        <path d="M38 24 L100 24" stroke="#B7BBA0" stroke-width="1.2" marker-end="url(#ah)"/>
        <path d="M104 28 L78 50" stroke="#B7BBA0" stroke-width="1.2" marker-end="url(#ah)"/>
        <path d="M62 50 L36 28" stroke="#B7BBA0" stroke-width="1.2" marker-end="url(#ah)"/>
        <defs><marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B7BBA0"/></marker></defs>
      </svg>
    </div>
  </aside>
  <main class="main">
    <div class="content">
      {{ content }}
    </div>
    <footer class="footer">&copy; {{ site.time | date: '%Y' }} {{ site.name }}. All rights not reserved.</footer>
  </main>
</div>
</body>
</html>
